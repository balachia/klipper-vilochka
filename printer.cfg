# This file contains common pin mappings for the BIGTREETECH Manta M5P
# To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" "8 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PD0/PD1)".

# See docs/Config_Reference.md for a description of parameters.

#[include xxx.cfg]
[include cfgs/settings.cfg]


[mcu]
serial: /dev/serial/by-path/platform-5200000.usb-usb-0:1.1:1.0
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 5000
max_z_velocity: 100
max_z_accel: 500

[duplicate_pin_override]
pins: EBBCan:PB6


#####################################################################
#      EBBCan
#####################################################################

[mcu EBBCan]
canbus_uuid: 5d0fa6782b3b

[adxl345]
cs_pin: EBBCan: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder]
step_pin: EBBCan: PD0
dir_pin: !EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan: PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.650
stealthchop_threshold: 999999


#####################################################################
#      X/Y/Z Stepper Settings
#####################################################################

# motor 1 (B, x+y)
[stepper_x]
step_pin: PC8
#dir_pin: !PC9
dir_pin: PC9
enable_pin: !PA15
full_steps_per_rotation: 400
microsteps: 64
rotation_distance: 40
#endstop_pin: tmc2209_stepper_x:virtual_endstop
endstop_pin: ^EBBCan:PB6
position_endstop: 145
position_min: -0.5
position_max: 147	# bed max: 145
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PD9
#run_current: 2.000 # nominal
run_current: 0.600
#diag_pin: ^PD3
#driver_SGTHRS: 150
# max sensitivity ~103
# min sensitivity ~90

# motor 2 (A, x-y)
[stepper_y]
step_pin: PA10
#dir_pin: !PA14
dir_pin: PA14
enable_pin: !PA13
full_steps_per_rotation: 400
microsteps: 64
rotation_distance: 40
endstop_pin: ^PD2
#endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 151.5
position_min: -15
position_max: 155.5	# bed max: 145
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PD8
#run_current: 2.000 # nominal
run_current: 0.600
#diag_pin: ^PD2
#driver_SGTHRS: 150
# max sensitivity ~100
# min sensitivity ~90

# motor 3 (z rear)
[stepper_z]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PA9
microsteps: 32
rotation_distance: 8
#endstop_pin: ^PC3	# endstop dowel switch
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 150

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 0.600
#diag_pin: PC3

# motor 4 (z front left)
[stepper_z1]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 32
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PB2
run_current: 0.600
#diag_pin: PC2

# motor 5 (z front right)
[stepper_z2]
step_pin: PB0
dir_pin: !PB1
enable_pin: !PC4
microsteps: 32
rotation_distance: 8

[tmc2209 stepper_z2]
uart_pin: PA6
run_current: 0.600
#diag_pin:


#####################################################################
#      Probing and Homing
#####################################################################

[probe]
pin: ^EBBCan:PB6
z_offset: 0
samples: 3

[z_tilt]
z_positions:
	72.95, 220.9
	-41.1, 1.513
	185.5, 2.515
points:
	5, 5
	140, 5
	140, 140
	5, 140
retries: 3
retry_tolerance: 0.1

[safe_z_home]
#home_xy_position: 91.5, 166.5
home_xy_position: 72.5, 72.5
speed: 50.0
z_hop: 10
z_hop_speed: 15

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 140, 140
probe_count: 5, 5


#####################################################################
#      Fans
#####################################################################

[fan]
pin: EBBCan: PA1

[heater_fan hotend_fan]
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0


#####################################################################
#      Bed
#####################################################################

[heater_bed]
heater_pin: PA5
sensor_type: Generic 3950
sensor_pin: PA0
min_temp: 0
max_temp: 130
#control: pid
#pid_kp: 186.38
#pid_ki: 36.12
#pid_kd: 637.30


#####################################################################
#      Misc
#####################################################################


########################################
# Fysetc Mini 12864
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PD5, EXP1_3=PB3, EXP1_5=PB5, EXP1_7=PB7, EXP1_9=<GND>,
    EXP1_2=PD4,  EXP1_4=PD6, EXP1_6=PB4, EXP1_8=PB6, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB8, EXP2_5=PC10, EXP2_7=PC12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB9, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
## Some micro-controller boards may require an spi bus to be specified:
#spi_bus: spi
## Alternatively, some micro-controller boards may work with software spi:
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[output_pin beeper]
pin: EXP1_1

[neopixel fysetc_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.4
initial_GREEN: 0.4
initial_BLUE: 0.4

